[package]
name = "dvrf"
version = "0.1.0"
edition = "2024"

authors = ["Nico Wagner <n.wagner@dnb.de>"]
repository = "https://github.com/deutsche-nationalbibliothek/dvrf-rs"
categories = ["parser-implementations"]
keywords = ["code4lib"]
license = "EUPL-1.2"

[dependencies]
flate2 = { version = "1.1.9" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }

[workspace]
resolver = "3"
members = ["crates/dvrf-cli"]
default-members = ["crates/dvrf-cli"]
