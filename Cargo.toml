[workspace]
resolver = "3"
default-members = ["crates/dvrf-cli"]
members = ["crates/dvrf-cli", "crates/dvrf"]

[workspace.package]
authors = ["Nico Wagner <n.wagner@dnb.de>"]
repository = "https://github.com/deutsche-nationalbibliothek/dvrf-rs"
readme = "README.md"
license = "EUPL-1.2"
rust-version = "1.85"
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = { version = "1.0.104" }
assert_cmd = { version = "2.2.2" }
assert_fs = { version = "1.1.4" }
clap = { version = "4.6.4", features = ["derive", "env"] }
dvrf = { path = "crates/dvrf", version = "0.1.0" }
flate2 = { version = "1.1.9" }
predicates = { version = "3.1.4" }
serde_json = { version = "1.0.151" }
serde = { version = "1.0.229", features = ["derive"] }
